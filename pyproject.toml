[project]
name = "cinema"
version = "0.1.0"
description = "Админка кинотеатра на PyQt6 + SQLite"
readme = "README.md"
authors = [{ name = "danil", email = "danil@email.com" }]
requires-python = ">=3.13"
dependencies = ["pyqt6>=6.11.0", "sqlalchemy>=2.1.5"]

[project.scripts]
cinema = "cinema:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.17.1"]
